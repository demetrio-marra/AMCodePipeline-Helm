apiVersion: v1
kind: Secret
metadata:
  name: {{ include "am-code-pipeline.fullname" . }}
  labels:
    {{- include "am-code-pipeline.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-auth-api-key: {{ .Values.secrets.apiAuthApiKey | quote }}
  huggingface-api-key: {{ .Values.secrets.inferenceProviders.HuggingFaceApiKey | quote }}
  together-api-key: {{ .Values.secrets.inferenceProviders.TogetherApiKey | quote }}
  fireworks-ai-api-key: {{ .Values.secrets.inferenceProviders.FireworksAIApiKey | quote }}
  openai-api-key: {{ .Values.secrets.inferenceProviders.OpenAIApiKey | quote }}
  lightrag-api-key: {{ .Values.secrets.lightRagApiKey | quote }}
  cohere-v1-reranker-api-key: {{ .Values.secrets.cohereV1RerankerApiKey | quote }}
